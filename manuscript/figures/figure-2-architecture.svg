<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1180" font-family="Helvetica, Arial, sans-serif" shape-rendering="geometricPrecision">
  <style>
    .fig-title { font-size: 28px; font-weight: 700; fill: #111; }
    .fig-subtitle { font-size: 17px; font-weight: 400; fill: #555; font-style: italic; }
    .phase-label { font-size: 15px; font-weight: 700; fill: #ffffff; letter-spacing: 1.8px; }
    .tier-label { font-size: 13px; font-weight: 700; fill: #888; letter-spacing: 1.5px; }
    .card-title { font-size: 20px; font-weight: 700; fill: #111; }
    .card-sub { font-size: 15px; font-weight: 400; fill: #555; }
    .card-body { font-size: 14px; font-weight: 400; fill: #444; }
    .col-hdr { font-size: 12px; font-weight: 700; fill: #1f4e79; letter-spacing: 1.3px; }
    .arrow-label { font-size: 13px; font-weight: 600; fill: #1f4e79; letter-spacing: 0.3px; }
    .arrow-sub { font-size: 12px; font-weight: 400; fill: #888; font-style: italic; }
    .phi-label { font-size: 12px; font-weight: 700; fill: #a25900; letter-spacing: 1.5px; }
    .nophi-label { font-size: 13px; font-weight: 700; fill: #166534; letter-spacing: 1.2px; }
    .nophi-badge-text { font-size: 11px; font-weight: 700; fill: #166534; letter-spacing: 1.1px; }
    .footer-note { font-size: 15px; font-weight: 400; fill: #555; font-style: italic; }
    .phase-band { fill: #1f4e79; }
    .card-main { fill: #ffffff; stroke: #d4d4d4; stroke-width: 1.2; }
    .outer { fill: none; stroke: #d4d4d4; stroke-width: 1.2; }
    .divider { stroke: #ececec; stroke-width: 1; }
    .arrow-line { stroke: #1f4e79; stroke-width: 1.8; fill: none; }
    .phi-zone { fill: #fdf5e3; stroke: #c9a76a; stroke-width: 1.2; }
    .phi-zone-banner { fill: #f5e1b5; }
    .nophi-badge { fill: #dcfce7; stroke: #86efac; stroke-width: 1; }
    .nophi-arrow { stroke: #166534; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
  </style>

  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f4e79"/>
    </marker>
    <marker id="arrow-nophi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#166534"/>
    </marker>

    <symbol id="i-vercel" viewBox="0 0 24 24">
      <path d="M24 22.525H0l12-21.05 12 21.05z" fill="#000000"/>
    </symbol>
    <symbol id="i-supabase" viewBox="0 0 24 24">
      <path d="M21.362 9.354H12V.396a.396.396 0 00-.716-.233L2.203 12.424l-.401.562a1.04 1.04 0 00.836 1.659H12v8.959a.396.396 0 00.716.233l9.081-12.261.401-.562a1.04 1.04 0 00-.836-1.66z" fill="#3ECF8E"/>
    </symbol>
    <symbol id="i-github" viewBox="0 0 24 24">
      <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12" fill="#181717"/>
    </symbol>
    <symbol id="i-powerautomate" viewBox="0 0 24 24">
      <rect width="24" height="24" rx="4" fill="#0066FF"/>
      <g fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 10 A6 6 0 0 1 18 10"/>
        <polyline points="15.5,7.5 18,10 20.2,7.8"/>
        <path d="M18 14 A6 6 0 0 1 6 14"/>
        <polyline points="8.5,16.5 6,14 3.8,16.2"/>
      </g>
    </symbol>
    <symbol id="i-onedrive" viewBox="0 0 24 24">
      <path d="M14 6.5 A5.2 5.2 0 0 0 9.1 10 A4 4 0 0 0 3.5 13.5 A4 4 0 0 0 7.5 17.5 H19 A3.2 3.2 0 0 0 22.2 14.3 A3.6 3.6 0 0 0 18.6 10.7 A5.2 5.2 0 0 0 14 6.5 Z" fill="#0364B8"/>
    </symbol>
    <symbol id="i-browser" viewBox="0 0 24 24">
      <rect x="2" y="4" width="20" height="16" rx="2" fill="#ffffff" stroke="#1f4e79" stroke-width="1.6"/>
      <line x1="2" y1="9" x2="22" y2="9" stroke="#1f4e79" stroke-width="1.6"/>
      <circle cx="5.5" cy="6.5" r="0.9" fill="#1f4e79"/>
      <circle cx="8.2" cy="6.5" r="0.9" fill="#1f4e79"/>
      <circle cx="10.9" cy="6.5" r="0.9" fill="#1f4e79"/>
    </symbol>
    <symbol id="i-lock" viewBox="0 0 24 24">
      <rect x="5" y="11" width="14" height="10" rx="2" fill="#1f4e79"/>
      <path d="M8 11 V7 A4 4 0 0 1 16 7 V11" stroke="#1f4e79" stroke-width="2" fill="none"/>
      <circle cx="12" cy="16" r="1.3" fill="#ffffff"/>
    </symbol>
  </defs>

  <rect width="1800" height="1180" fill="#ffffff"/>

  <!-- Title -->
  <text x="900" y="54" text-anchor="middle" class="fig-title">System architecture and HIPAA boundary</text>
  <text x="900" y="88" text-anchor="middle" class="fig-subtitle">Three-tier web application — every layer substitutable without rewriting the others.</text>

  <!-- Outer frame -->
  <rect x="60" y="112" width="1680" height="1008" rx="8" class="outer"/>

  <!-- ========================================================== -->
  <!-- Section 1: Main architecture (y=112..740)                    -->
  <!-- ========================================================== -->
  <rect x="60" y="112" width="1680" height="40" class="phase-band"/>
  <text x="80" y="139" class="phase-label">MAIN ARCHITECTURE</text>

  <!-- Tier labels -->
  <text x="90" y="224" class="tier-label">CLIENT</text>
  <text x="90" y="410" class="tier-label">APPLICATION</text>
  <text x="90" y="624" class="tier-label">DATA</text>

  <!-- Tier 1: CLIENT (y=174..274) -->
  <rect x="200" y="174" width="1480" height="100" rx="8" class="card-main"/>
  <use href="#i-browser" x="230" y="207" width="34" height="34"/>
  <text x="280" y="217" class="card-title">Resident or faculty browser</text>
  <text x="280" y="245" class="card-sub">Any modern device — signs in with institutional email + shared site password</text>
  <line x1="1370" y1="194" x2="1370" y2="254" class="divider"/>
  <use href="#i-lock" x="1394" y="207" width="30" height="30"/>
  <text x="1434" y="220" class="col-hdr">DOMAIN-LOCKED ALLOWLIST</text>
  <text x="1434" y="246" class="card-body">@ohsu.edu · @uoregon.edu — swappable for SAML / OIDC</text>

  <!-- Arrow CLIENT → APPLICATION -->
  <path d="M 940 278 L 940 340" class="arrow-line" marker-end="url(#arrow-navy)" marker-start="url(#arrow-navy)"/>
  <text x="960" y="302" class="arrow-label">HTTPS</text>
  <text x="960" y="319" class="arrow-sub">TLS in transit</text>

  <!-- Tier 2: APPLICATION (y=344..494) -->
  <!-- Vercel card -->
  <rect x="200" y="344" width="1050" height="150" rx="8" class="card-main"/>
  <use href="#i-vercel" x="228" y="374" width="30" height="30"/>
  <text x="270" y="391" class="card-title">Vercel — Next.js App Router</text>
  <text x="270" y="418" class="card-sub">TypeScript · Tailwind CSS · shadcn/ui · serverless hosting on edge + Node runtimes</text>
  <line x1="228" y1="436" x2="1222" y2="436" class="divider"/>
  <text x="228" y="458" class="col-hdr">SERVER COMPONENTS</text>
  <text x="228" y="478" class="card-body">Page rendering</text>
  <text x="560" y="458" class="col-hdr">SERVER ACTIONS</text>
  <text x="560" y="478" class="card-body">Writes, mutations, uploads</text>
  <text x="892" y="458" class="col-hdr">STATIC + MEDIA</text>
  <text x="892" y="478" class="card-body">PDFs via signed URLs</text>

  <!-- GitHub card -->
  <rect x="1280" y="344" width="400" height="150" rx="8" class="card-main"/>
  <use href="#i-github" x="1308" y="374" width="30" height="30"/>
  <text x="1348" y="391" class="card-title">GitHub</text>
  <text x="1308" y="418" class="card-sub">MIT-licensed source</text>
  <line x1="1308" y1="436" x2="1652" y2="436" class="divider"/>
  <text x="1308" y="458" class="col-hdr">CONTINUOUS DEPLOY</text>
  <text x="1308" y="478" class="card-body">Fork → connect to Vercel → auto-deploy on push</text>

  <!-- Arrow GitHub → Vercel -->
  <path d="M 1280 400 L 1250 400" class="arrow-line" marker-end="url(#arrow-navy)"/>

  <!-- Arrow APPLICATION → DATA -->
  <path d="M 940 498 L 940 560" class="arrow-line" marker-end="url(#arrow-navy)" marker-start="url(#arrow-navy)"/>
  <text x="960" y="523" class="arrow-label">Supabase JS client</text>
  <text x="960" y="540" class="arrow-sub">anon (browser) · service role (server)</text>

  <!-- Tier 3: DATA (y=564..702) -->
  <rect x="200" y="564" width="1480" height="138" rx="8" class="card-main"/>
  <use href="#i-supabase" x="228" y="592" width="30" height="30"/>
  <text x="270" y="609" class="card-title">Supabase — managed backend</text>
  <text x="270" y="636" class="card-sub">PostgreSQL + Auth + object storage on the free tier (≈ 500 MB, more than sufficient for residency-scale use)</text>
  <rect x="1490" y="594" width="162" height="26" rx="13" class="nophi-badge"/>
  <text x="1571" y="611" text-anchor="middle" class="nophi-badge-text">NO PHI STORED</text>
  <line x1="228" y1="654" x2="1652" y2="654" class="divider"/>
  <text x="228" y="676" class="col-hdr">POSTGRESQL</text>
  <text x="228" y="694" class="card-body">Sessions · papers · wish list · research ideas · admins</text>
  <text x="760" y="676" class="col-hdr">AUTH</text>
  <text x="760" y="694" class="card-body">Session cookies · domain allowlist enforced in code</text>
  <text x="1224" y="676" class="col-hdr">OBJECT STORAGE</text>
  <text x="1224" y="694" class="card-body">Journal-club PDFs · signed URLs · admin-only writes</text>

  <!-- ========================================================== -->
  <!-- Section 2: HIPAA-compatible teaching-case capture           -->
  <!-- ========================================================== -->
  <rect x="60" y="740" width="1680" height="40" class="phase-band"/>
  <text x="80" y="767" class="phase-label">OPTIONAL — HIPAA-COMPATIBLE TEACHING-CASE CAPTURE</text>

  <!-- PHI zone behind cards 3 & 4 -->
  <rect x="908" y="808" width="782" height="178" rx="10" class="phi-zone"/>
  <rect x="908" y="808" width="782" height="26" rx="10" class="phi-zone-banner"/>
  <path d="M 908 824 L 1690 824" stroke="none" fill="none"/>
  <text x="1299" y="826" text-anchor="middle" class="phi-label">PHI STORED HERE · INSIDE INSTITUTIONAL BAA</text>

  <!-- Row of 4 cards: y=850..960 -->
  <!-- Card 1: Case form (browser) -->
  <rect x="130" y="850" width="340" height="110" rx="8" class="card-main"/>
  <use href="#i-browser" x="150" y="870" width="28" height="28"/>
  <text x="190" y="886" class="card-title" style="font-size:18px">Case form in app</text>
  <text x="150" y="916" class="card-body">Fracture type, side, mechanism,</text>
  <text x="150" y="934" class="card-body">teaching note entered in the browser.</text>

  <!-- Card 2: Server Action (Vercel) -->
  <rect x="530" y="850" width="340" height="110" rx="8" class="card-main"/>
  <use href="#i-vercel" x="550" y="872" width="24" height="24"/>
  <text x="586" y="886" class="card-title" style="font-size:18px">Server Action (Vercel)</text>
  <text x="550" y="916" class="card-body">Splits identifying and</text>
  <text x="550" y="934" class="card-body">non-identifying fields before writing.</text>

  <!-- Card 3: Power Automate -->
  <rect x="930" y="850" width="340" height="110" rx="8" class="card-main"/>
  <use href="#i-powerautomate" x="950" y="870" width="28" height="28"/>
  <text x="990" y="886" class="card-title" style="font-size:18px">Power Automate</text>
  <text x="950" y="916" class="card-body">HTTP-trigger flow in the</text>
  <text x="950" y="934" class="card-body">institutional tenant appends a row.</text>

  <!-- Card 4: OneDrive workbook -->
  <rect x="1330" y="850" width="340" height="110" rx="8" class="card-main"/>
  <use href="#i-onedrive" x="1350" y="870" width="28" height="28"/>
  <text x="1390" y="886" class="card-title" style="font-size:18px">OneDrive workbook</text>
  <text x="1350" y="916" class="card-body">Teaching_Case_Repository.xlsx —</text>
  <text x="1350" y="934" class="card-body">stored only in institutional OneDrive.</text>

  <!-- Arrows in the top row -->
  <path d="M 470 905 L 528 905" class="arrow-line" marker-end="url(#arrow-navy)"/>
  <path d="M 870 905 L 928 905" class="arrow-line" marker-end="url(#arrow-navy)"/>
  <path d="M 1270 905 L 1328 905" class="arrow-line" marker-end="url(#arrow-navy)"/>

  <!-- No-PHI mirror path: arrow from Card 2 down, Card 5 centered under Card 2 -->
  <path d="M 700 962 L 700 1016" class="nophi-arrow" marker-end="url(#arrow-nophi)"/>
  <text x="716" y="984" class="nophi-label">NO-PHI MIRROR</text>
  <text x="716" y="1002" class="arrow-sub">non-identifying fields only</text>

  <!-- Card 5: Supabase mirror (no PHI) -->
  <rect x="400" y="1018" width="600" height="82" rx="8" class="card-main"/>
  <use href="#i-supabase" x="424" y="1040" width="26" height="26"/>
  <text x="462" y="1055" class="card-title" style="font-size:18px">Supabase — non-identifying mirror</text>
  <text x="424" y="1082" class="card-body">Fracture type · timestamp · submitter role — for counts and listing only; never identifiers.</text>
  <rect x="866" y="1040" width="112" height="22" rx="11" class="nophi-badge"/>
  <text x="922" y="1055" text-anchor="middle" class="nophi-badge-text">NO PHI</text>

  <!-- Footer note -->
  <text x="900" y="1152" text-anchor="middle" class="footer-note">All vendors operate on free tiers sufficient for residency-scale use. Each layer is substitutable without rewriting the others.</text>
</svg>
